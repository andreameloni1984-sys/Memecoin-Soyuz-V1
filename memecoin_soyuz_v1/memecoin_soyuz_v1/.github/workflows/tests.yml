name: Memecoin Soyuz Tests

on:
  push:
    paths:
      - "memecoin_soyuz_v1/**"

  pull_request:
    paths:
      - "memecoin_soyuz_v1/**"

  workflow_dispatch:

jobs:
  test:
    name: Run Soyuz Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: memecoin_soyuz_v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q